# CECAMed - Configuración de Aplicación y Base de Datos
db.host=localhost
db.port=5432
db.name=cecamed_db
db.username=postgres
db.password=Palencia

# HikariCP Pool Configuration
hikari.maximum-pool-size=10
hikari.minimum-idle=2
hikari.idle-timeout-ms=30000
hikari.connection-timeout-ms=20000
hikari.max-lifetime-ms=1800000

# Flyway Migrations
flyway.enabled=true
flyway.baseline-on-migrate=true
